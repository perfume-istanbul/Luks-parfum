<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LÜKS PARFÜM | Orijinal Tester ve Lüks Parfüm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0f0f11;
      color: #e0e0e0;
      padding-bottom: 40px;
    }

    /* Luxury Header Design */
    header {
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #0d0d0d 100%);
      padding: 40px 20px;
      text-align: center;
      border-bottom: 2px solid #d4af37;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .logo-title {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #fff 0%, #d4af37 50%, #f9e076 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(212,175,55,0.2);
    }

    .subtitle {
      font-size: 0.85rem;
      color: #a6a6a6;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
    }

    .gold-divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      margin: 15px auto 0;
    }

    /* Product Grid Layout */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .card {
      background: #18181c;
      border-radius: 16px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(212, 175, 55, 0.15);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background-color: #121214;
    }

    .card-body {
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .product-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .product-desc {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 15px;
    }

    .price {
      font-size: 1.3rem;
      font-weight: 700;
      color: #d4af37;
      margin-bottom: 15px;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
      transition: background 0.3s;
    }

    .btn-whatsapp:hover {
      background: linear-gradient(135deg, #20ba5a, #0e6f63);
    }
  </style>
</head>
<body>

  <header>
    <h1 class="logo-title">LÜKS PARFÜM</h1>
    <p class="subtitle">Orijinal Tester ve Lüks Parfüm Koleksiyonu</p>
    <div class="gold-divider"></div>
  </header>

  <div class="container">
    <!-- Chanel N°5 Card Example -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=800&auto=format&fit=crop" alt="Chanel N°5">
      <div class="card-body">
        <div>
          <h2 class="product-title">Chanel N°5</h2>
          <p class="product-desc">Eau de Parfum - 100ml</p>
          <div class="price">1.200 TL</div>
        </div>
        <a href="https://wa.me/905537853944?text=Merhaba,%20Chanel%20N5%20sipari%C3%9F%20etmek%20istiyorum." class="btn-whatsapp" target="_blank">
          WhatsApp ile Sipariş Et 💬
        </a>
      </div>
    </div>
  </div>

</body>
</html>
