<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lüks Parfüm | Lüks ve Tester Parfümler</title>
    <meta name="description" content="Orijinal tester ve lüks parfümler. Kapıda ödeme ve hızlı teslimat seçeneğiyle.">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #f8f9fa; color: #222; }
        header { background: #111; color: #fff; text-align: center; padding: 2.5rem 1rem; }
        header h1 { font-size: 2.2rem; letter-spacing: 3px; font-weight: 300; }
        header p { color: #aaa; font-size: 0.95rem; margin-top: 5px; }
        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2rem; }
        .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 280px; object-fit: cover; background-color: #f0f0f0; }
        .info { padding: 1.5rem; text-align: center; }
        .title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.4rem; }
        .type { font-size: 0.85rem; color: #666; margin-bottom: 0.8rem; }
        .price { font-size: 1.4rem; color: #b8860b; font-weight: bold; margin-bottom: 1rem; }
        .btn-wa { display: block; background-color: #25D366; color: white; text-decoration: none; padding: 0.8rem; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .btn-wa:hover { background-color: #1eb854; }
        footer { text-align: center; padding: 2rem; background: #111; color: #777; margin-top: 3rem; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>LÜKS PARFÜM</h1>
        <p>Orijinal Tester ve Lüks Parfüm Koleksiyonu</p>
    </header>

    <div class="container">
        <div class="grid">
            
            <!-- Parfüm 1 -->
            <div class="card">
                <img src="chanel-no5.jpg" alt="Chanel N°5">
                <div class="info">
                    <div class="title">Chanel N°5</div>
                    <div class="type">Eau de Parfum - 100ml</div>
                    <div class="price">1.200 TL</div>
                    <a href="https://wa.me/905537853944?text=Merhaba,%20Chanel%20N°5%20parfümü%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" class="btn-wa">
                        WhatsApp ile Sipariş Et 💬
                    </a>
                </div>
            </div>

            <!-- Parfüm 2 -->
            <div class="card">
                <img src="allure-sport.jpg" alt="Chanel Allure Homme Sport">
                <div class="info">
                    <div class="title">Allure Homme Sport</div>
                    <div class="type">Eau de Toilette (Tester) - 100ml</div>
                    <div class="price">1.100 TL</div>
                    <a href="https://wa.me/905537853944?text=Merhaba,%20Allure%20Homme%20Sport%20parfümü%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" class="btn-wa">
                        WhatsApp ile Sipariş Et 💬
                    </a>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p>© 2026 Lüks Parfüm. Tüm hakları saklıdır.</p>
    </footer>

</body>
</html>
